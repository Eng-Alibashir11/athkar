<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار الصباح والمساء</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --accent-night: #8e44ad;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body.night-mode {
            --primary-color: #2c3e50;
            --accent-color: #8e44ad;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e94560;
            --text-secondary: #b2b2b2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: var(--shadow);
            position: relative;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
        }

        .tab-btn.active {
            background: white;
            color: var(--accent-color);
        }

        body.night-mode .tab-btn.active {
            color: var(--accent-night);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .action-btn {
            background-color: var(--card-bg);
            border: 1px solid #ddd;
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            border: none;
        }

        .add-btn {
            background-color: #3498db;
            color: white;
            border: none;
        }

        .azkar-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .azkar-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            border-right: 5px solid var(--accent-color);
            transition: var(--transition);
        }
        
        body.night-mode .azkar-card {
            border-right: 5px solid var(--accent-night);
        }

        /* أزرار التعديل والحذف */
        .card-actions {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        .edit-btn { color: #f39c12; }
        .delete-btn { color: #e74c3c; }

        .checkbox-area {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .azkar-text {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            line-height: 1.8;
            margin-bottom: 15px;
            margin-top: 10px;
            color: var(--text-color);
        }

        .azkar-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 10px;
        }

        .counter-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        
        body.night-mode .counter-btn {
            background-color: var(--accent-night);
        }

        .counter-btn:active {
            transform: scale(0.9);
        }

        .counter-display {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .meta-info {
            font-size: 0.85rem;
            color: #888;
        }

        /* مودال (نافذة منبثقة) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        body.night-mode .modal-content {
            background-color: #1a1a2e;
            color: white;
        }

        /* رسائل التنبيه (Toast) */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 16px;
            position: fixed;
            z-index: 1001;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }

        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }

        .completed .azkar-text {
            text-decoration: line-through;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h1>أذكار المسلم</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('morning')">أذكار الصباح</button>
            <button class="tab-btn" onclick="switchTab('evening')">أذكار المساء</button>
        </div>
    </header>

    <div class="controls">
        <button class="action-btn add-btn" onclick="openModal()">
            <span>+</span> إضافة ذكر
        </button>
        <button class="action-btn whatsapp-btn" onclick="shareSelected()">
            <span>📱 إرسال المختارة</span>
        </button>
    </div>

    <main id="azkar-list" class="azkar-container">
        <!-- سيتم ملء الأذكار هنا -->
    </main>

    <!-- Modal للإضافة والتعديل -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">إضافة ذكر جديد</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="azkarForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>نص الذكر:</label>
                    <textarea id="azkarText" rows="4" required placeholder="أدخل نص الذكر هنا..."></textarea>
                </div>
                <div class="form-group">
                    <label>عدد المرات:</label>
                    <input type="number" id="azkarCount" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>المصدر / المعلومات:</label>
                    <input type="text" id="azkarSource" placeholder="مثال: رواه البخاري">
                </div>
                <button type="submit" class="submit-btn" id="formSubmitBtn">حفظ</button>
            </form>
        </div>
    </div>

    <!-- عنصر التنبيه -->
    <div id="toast" class="toast">تمت العملية بنجاح</div>

    <script>
        const defaultAzkar = {
            morning: [
                { id: 1, text: "آية الكرسي: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...", count: 1, source: "سورة البقرة - آية 255", custom: true }, // custom: true لتسهيل الحذف في البداية
                { id: 2, text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ...", count: 1, source: "مسلم", custom: true },
                { id: 3, text: "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", count: 1, source: "الترمذي", custom: true },
                { id: 4, text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", count: 100, source: "متفق عليه", custom: true },
                { id: 5, text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 100, source: "متفق عليه", custom: true }
            ],
            evening: [
                { id: 6, text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ...", count: 1, source: "مسلم", custom: true },
                { id: 7, text: "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.", count: 1, source: "الترمذي", custom: true },
                { id: 8, text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3, source: "أحمد وابن ماجه", custom: true },
                { id: 9, text: "آية الكرسي", count: 1, source: "سورة البقرة", custom: true },
                { id: 10, text: "اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ...", count: 4, source: "أبو داود والترمذي", custom: true }
            ]
        };

        let currentTab = 'morning';
        let azkarData = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderAzkar();
            updateTheme();
        });

        function loadData() {
            const savedData = localStorage.getItem('myAzkarApp');
            if (savedData) {
                azkarData = JSON.parse(savedData);
            } else {
                azkarData = JSON.parse(JSON.stringify(defaultAzkar));
            }
        }

        function saveData() {
            localStorage.setItem('myAzkarApp', JSON.stringify(azkarData));
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tab === 'morning') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
            }
            updateTheme();
            renderAzkar();
        }

        function updateTheme() {
            const body = document.body;
            if (currentTab === 'evening') {
                body.classList.add('night-mode');
            } else {
                body.classList.remove('night-mode');
            }
        }

        function renderAzkar() {
            const container = document.getElementById('azkar-list');
            container.innerHTML = '';
            
            const list = azkarData[currentTab];
            
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'azkar-card';
                if (item.current >= item.count) {
                    card.classList.add('completed');
                }

                // أزرار التعديل والحذف
                const actionButtons = `
                    <div class="card-actions">
                        <button class="icon-btn edit-btn" onclick="openEditModal(${item.id})" title="تعديل">✎</button>
                        <button class="icon-btn delete-btn" onclick="deleteAzkar(${item.id})" title="حذف">🗑️</button>
                    </div>
                `;

                card.innerHTML = `
                    ${actionButtons}
                    <div class="checkbox-area">
                        <input type="checkbox" onchange="toggleSelection(${item.id})" id="chk-${item.id}">
                    </div>
                    <div class="azkar-text">${item.text}</div>
                    <div class="azkar-footer">
                        <div class="meta-info">
                            ${item.source ? item.source : ''}
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="counter-display">${item.current} / ${item.count}</span>
                            <button class="counter-btn" onclick="incrementCounter(${item.id})">✓</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function incrementCounter(id) {
            const list = azkarData[currentTab];
            const item = list.find(x => x.id === id);
            if (item && item.current < item.count) {
                item.current++;
                saveData();
                renderAzkar();
                if (item.current === item.count) {
                    showToast("أكملت هذا الذكر، جزاك الله خيراً");
                }
            }
        }

        // --- إدارة المودال (إضافة وتعديل) ---
        function openModal() {
            // إعادة تعيين النموذج للإضافة
            document.getElementById('azkarForm').reset();
            document.getElementById('editId').value = "";
            document.getElementById('modalTitle').innerText = "إضافة ذكر جديد";
            document.getElementById('formSubmitBtn').innerText = "حفظ";
            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal(id) {
            const list = azkarData[currentTab];
            const item = list.find(x => x.id === id);
            if(item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('azkarText').value = item.text;
                document.getElementById('azkarCount').value = item.count;
                document.getElementById('azkarSource').value = item.source;
                
                document.getElementById('modalTitle').innerText = "تعديل الذكر";
                document.getElementById('formSubmitBtn').innerText = "تحديث";
                document.getElementById('modal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const text = document.getElementById('azkarText').value;
            const count = parseInt(document.getElementById('azkarCount').value);
            const source = document.getElementById('azkarSource').value;

            if (editId) {
                // وضع التعديل
                const list = azkarData[currentTab];
                const index = list.findIndex(x => x.id == editId);
                if (index !== -1) {
                    list[index].text = text;
                    list[index].count = count;
                    list[index].source = source;
                    // إعادة تعيين التقدم إذا تغير العداد
                    if(list[index].current > count) list[index].current = 0;
                    showToast("تم تعديل الذكر بنجاح");
                }
            } else {
                // وضع الإضافة
                const newId = Date.now();
                const newDhikr = {
                    id: newId,
                    text: text,
                    count: count,
                    source: source,
                    custom: true,
                    current: 0
                };
                azkarData[currentTab].push(newDhikr);
                showToast("تمت إضافة الذكر بنجاح");
            }

            saveData();
            renderAzkar();
            closeModal();
        }

        function deleteAzkar(id) {
            if(confirm("هل أنت متأكد من حذف هذا الذكر؟")) {
                azkarData[currentTab] = azkarData[currentTab].filter(item => item.id !== id);
                saveData();
                renderAzkar();
                showToast("تم حذف الذكر");
            }
        }

        // --- المشاركة ---
        function toggleSelection(id) {
            // فقط لتفعيل المربع
        }

        function shareSelected() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            
            if (checkboxes.length === 0) {
                showToast("الرجاء تحديد الأذكار التي تريد مشاركتها أولاً");
                return;
            }

            let message = `🌿 *أذكار ${currentTab === 'morning' ? 'الصباح' : 'المساء'}*\n\n`;
            
            checkboxes.forEach(chk => {
                const id = parseInt(chk.id.split('-')[1]);
                const item = azkarData[currentTab].find(x => x.id === id);
                if (item) {
                    // إضافة النص
                    message += `▫️ ${item.text}\n`;
                    // إضافة عدد المرات كطلب من المستخدم
                    message += `[التكرار: ${item.count}]`;
                    
                    if(item.source) message += ` _(${item.source})_`;
                    message += `\n\n`;
                }
            });

            const encodedMsg = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/?text=${encodedMsg}`;
            
            window.open(whatsappUrl, '_blank');
            checkboxes.forEach(c => c.checked = false);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
